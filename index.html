<style>
/* ============================================================
   Champion Design System — signal mode
   github.com/codychampion/design-system
   ============================================================ */

:root {
  /* Type scale */
  --t-xs: 10px; --t-sm: 12px; --t-base: 16px; --t-md: 20px;
  --t-lg: 25px; --t-xl: 31px; --t-2xl: 39px; --t-3xl: 49px; --t-4xl: 64px;
  /* Spacing */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px;
  --s-8: 32px; --s-12: 48px; --s-16: 64px; --s-24: 96px;
  /* Radius */
  --r-sm: 3px; --r-md: 6px; --r-lg: 12px; --r-full: 9999px;
  /* Motion */
  --easing: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 200ms; --dur-comp: 350ms;
  /* Elevation */
  --shadow-1: 0 1px 3px rgba(0,0,0,.12);
  --shadow-2: 0 4px 12px rgba(0,0,0,.16);
  /* Layout */
  --container: 1280px; --readable: 68ch;

  /* Signal palette */
  --c-bg:            #f8f7f4;
  --c-bg-subtle:     #eeecea;
  --c-bg-raised:     #ffffff;
  --c-border:        #d8d5cf;
  --c-border-strong: #9c9890;
  --c-text:          #1a1916;
  --c-text-subtle:   #6b6760;
  --c-text-disabled: #b8b4ae;
  --c-accent:        #1a4fd6;
  --c-accent-subtle: #eef2fc;
  --c-accent-text:   #ffffff;
  --c-success:       #1a7f4b;
  --c-warning:       #a15f00;
  --c-danger:        #c8342e;

  /* Signal type stacks */
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body:    "Lora", Georgia, serif;
  --font-ui:      "DM Sans", system-ui, -apple-system, sans-serif;
  --font-mono:    "DM Mono", ui-monospace, "SF Mono", monospace;

  --lh-body: 1.55;
  --lh-display: 1.05;
  --symbol: "◆";
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-body);
  font-size: var(--t-base);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { max-width: 100%; height: auto; }
::selection { background: var(--c-accent); color: var(--c-accent-text); }

/* ── Brand strip ───────────────────────────────────────────── */
.brand-strip {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: var(--s-6);
  padding: var(--s-3) var(--s-12);
  border-bottom: 1px solid var(--c-border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: 0.03em;
  color: var(--c-text);
  text-decoration: none;
}
.brand .crest {
  display: inline-block;
  width: 13px; height: 15px;
  background-color: var(--c-text);
  -webkit-mask: url('assets/crest_white.png') center/contain no-repeat;
          mask: url('assets/crest_white.png') center/contain no-repeat;
  flex-shrink: 0;
}
.brand-nav {
  display: flex;
  gap: var(--s-6);
  justify-self: end;
  align-items: center;
  font-family: var(--font-ui);
  font-size: var(--t-sm);
}
.brand-nav a {
  color: var(--c-text-subtle);
  text-decoration: none;
  transition: color var(--dur-micro) var(--easing);
}
.brand-nav a:hover { color: var(--c-text); }
.brand-nav .sep { color: var(--c-border-strong); margin: 0 2px; }

/* ── Postscript ────────────────────────────────────────────── */
.postscript {
  margin: var(--s-16) var(--s-12) var(--s-12);
  padding: var(--s-4) var(--s-6);
  background: var(--c-bg-subtle);
  border: 1px solid var(--c-border);
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 12px;
  color: var(--c-text);
  line-height: 1.6;
}
.postscript__head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: var(--s-3);
  padding-bottom: var(--s-2);
  border-bottom: 1px solid var(--c-border);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--c-text-subtle);
}
.postscript__head strong { color: var(--c-text); font-weight: 500; }
.postscript__head .live::before {
  content: "";
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--c-accent);
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 6px;
  animation: ps-pulse 1.6s ease-in-out infinite;
}
@keyframes ps-pulse { 50% { opacity: 0.35; } }
.postscript__grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--s-4);
}
.postscript__cell .lbl {
  font-size: 9.5px;
  letter-spacing: 0.16em;
  color: var(--c-text-subtle);
  text-transform: uppercase;
  display: block;
  margin-bottom: 2px;
}
.postscript__cell .val { color: var(--c-text); }
.postscript__cell .em { color: var(--c-accent); }
.postscript__foot {
  margin-top: var(--s-3);
  padding-top: var(--s-2);
  border-top: 1px solid var(--c-border);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--c-text-subtle);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: var(--s-3);
  align-items: baseline;
}
.postscript__foot a { color: var(--c-accent); text-decoration: none; }
.postscript__foot a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ──────────────────────────────────────────────
   Mobile/tablet (≤ 900px) overrides
   ────────────────────────────────────────────── */
@media (max-width: 900px) {
  body section { padding: 48px 20px !important; }

  body section > div,
  body section > article,
  body section > article > div,
  body section > div > div { grid-template-columns: 1fr !important; gap: 20px !important; }
  body section[id="sec-patents"] { grid-template-columns: 1fr !important; gap: 48px !important; }
  body section > div[style*="grid-template-columns"]:nth-of-type(2) { grid-template-columns: 1fr 1fr !important; }
  body #root > div > section:nth-of-type(2) > div:nth-of-type(2) { grid-template-columns: 1fr !important; }

  body h1 { font-size: clamp(56px, 18vw, 120px) !important; line-height: 0.92 !important; }
  body section[id="sec-outcomes"] div[style*="font-size: 84"],
  body section[id="sec-outcomes"] > div:nth-of-type(2) > div > div:first-child { font-size: 56px !important; }
  body section[id="sec-contact"] > div:first-child { font-size: 40px !important; }
  body section h3 { font-size: 26px !important; line-height: 1.15 !important; }
  body section[id="sec-about"] > div:nth-of-type(2) > div:first-child { font-size: 24px !important; }
  body section p, body section[id="sec-about"] p { font-size: 16px !important; }
  body section[id="sec-publications"] ol li { grid-template-columns: 36px 1fr !important; gap: 12px !important; }
  body section[id="sec-publications"] ol li > span:last-child { grid-column: 2 !important; text-align: left !important; font-size: 11px !important; }
  body section[id="sec-education"] > div { grid-template-columns: 1fr !important; }
  body section[id="sec-patents"] div[style*="grid-template-columns: 80px"] { grid-template-columns: 56px 1fr !important; }
  body div[style*="font-size: 48"] { font-size: 32px !important; }
  body section img[alt="Cody Champion"] { max-height: 320px; }
  body a[href^="mailto:"], body a[href^="https://github"], body a[href^="https://www.github"] {
    word-break: break-word !important; overflow-wrap: anywhere !important; max-width: 100% !important;
  }
  body section[id="sec-contact"] a {
    font-size: 11px !important; padding: 12px 16px !important; max-width: 100% !important;
  }

  .brand-strip { padding: var(--s-2) var(--s-4) !important; gap: var(--s-3) !important; }
  .brand { font-size: 15px !important; }
  .brand-nav { gap: var(--s-3) !important; font-size: 11px !important; }
  .brand-nav .sep { display: none; }
  .brand-nav a[href="case-study-ml-cost.html"],
  .brand-nav a[href="print.html"],
  .brand-nav a[href="recruiters.html"] { display: none; }

  .postscript { margin: var(--s-12) var(--s-4) var(--s-6) !important; }
  .postscript__grid { grid-template-columns: 1fr !important; }
  .postscript__foot { grid-template-columns: 1fr !important; }
}
</style>
