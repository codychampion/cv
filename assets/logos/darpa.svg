<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" height="40" aria-label="DARPA">
  <defs>
    <clipPath id="oval-clip">
      <ellipse cx="175" cy="100" rx="157" ry="85"/>
    </clipPath>
  </defs>
  <!-- Globe grid lines (clipped to oval interior) -->
  <g clip-path="url(#oval-clip)" fill="none" stroke="#1a3057" stroke-width="2.2">
    <!-- Meridian ellipses: 4 inner vertical ellipses at decreasing rx -->
    <ellipse cx="175" cy="100" rx="128" ry="85"/>
    <ellipse cx="175" cy="100" rx="93" ry="85"/>
    <ellipse cx="175" cy="100" rx="56" ry="85"/>
    <ellipse cx="175" cy="100" rx="20" ry="85"/>
    <!-- Latitude lines: 7 horizontal lines equally spaced within oval -->
    <line x1="15" y1="28"  x2="335" y2="28"/>
    <line x1="15" y1="52"  x2="335" y2="52"/>
    <line x1="15" y1="76"  x2="335" y2="76"/>
    <line x1="15" y1="100" x2="335" y2="100"/>
    <line x1="15" y1="124" x2="335" y2="124"/>
    <line x1="15" y1="148" x2="335" y2="148"/>
    <line x1="15" y1="172" x2="335" y2="172"/>
  </g>
  <!-- Outer oval border (thick) -->
  <ellipse cx="175" cy="100" rx="157" ry="85" fill="none" stroke="#1a3057" stroke-width="6"/>
  <!-- DARPA wordmark text -->
  <text x="175" y="116" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" font-size="62" letter-spacing="3" text-anchor="middle" fill="#1a3057">DARPA</text>
</svg>
