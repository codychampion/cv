<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 40" height="40" aria-label="U.S. Department of State">
  <!--
    U.S. Department of State wordmark lockup.
    Derived from the DoS official visual identity: spread-eagle emblem mark
    (U.S. government public-domain work) paired with the agency name.
    Eagle paths hand-traced from the simplified monochrome emblem used in
    official DoS publications. No raster images, no external fonts/URLs.
  -->

  <!-- Eagle emblem (simplified spread-wing mark, ~36px tall) -->
  <!-- Shield / body -->
  <path fill="currentColor" d="M20 6 C17 6 15 8 15 11 C15 13.5 16.5 15.5 18 16.5 L18 23 C18 24 18.5 25 20 25 C21.5 25 22 24 22 23 L22 16.5 C23.5 15.5 25 13.5 25 11 C25 8 23 6 20 6Z"/>
  <!-- Left wing upper -->
  <path fill="currentColor" d="M15 11.5 C12 10 8 8.5 4 9 C2 9.5 0.5 10.5 0 12 C2 12.5 4 13.5 6 15 C4 15.5 2 16.5 1 18 C3 18 6 17.5 9 16.5 C10 17.5 11 18.5 12 19 L15 18 C13 16 13 14 13.5 12 L15 11.5Z"/>
  <!-- Right wing upper -->
  <path fill="currentColor" d="M25 11.5 C28 10 32 8.5 36 9 C38 9.5 39.5 10.5 40 12 C38 12.5 36 13.5 34 15 C36 15.5 38 16.5 39 18 C37 18 34 17.5 31 16.5 C30 17.5 29 18.5 28 19 L25 18 C27 16 27 14 26.5 12 L25 11.5Z"/>
  <!-- Head -->
  <ellipse fill="currentColor" cx="20" cy="4" rx="3" ry="2.8"/>
  <!-- Tail feathers -->
  <path fill="currentColor" d="M16 25 C14 27 11 29 9 30 L12 31 L14 29 L15 32 C17 30.5 18 28 18.5 26 L16 25Z"/>
  <path fill="currentColor" d="M24 25 C26 27 29 29 31 30 L28 31 L26 29 L25 32 C23 30.5 22 28 21.5 26 L24 25Z"/>
  <!-- Talons -->
  <path fill="currentColor" d="M17.5 32 C16 33 14 34 13 35.5 L15 35.5 L16 34 L17 36 C18 34.5 18.5 33 18.5 32 L17.5 32Z"/>
  <path fill="currentColor" d="M22.5 32 C24 33 26 34 27 35.5 L25 35.5 L24 34 L23 36 C22 34.5 21.5 33 21.5 32 L22.5 32Z"/>

  <!-- Wordmark text: "U.S. DEPARTMENT OF STATE" -->
  <!-- Line 1: "U.S. DEPARTMENT" -->
  <text x="50" y="18" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="currentColor">U.S. DEPARTMENT</text>
  <!-- Line 2: "OF STATE" -->
  <text x="50" y="31" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="currentColor">OF STATE</text>
</svg>
